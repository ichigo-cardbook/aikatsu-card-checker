
name: Check official Aikatsu cards

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser
        run: pip install beautifulsoup4

      - name: Update cards
        run: python scripts/update_cards.py

      - name: Save changes
        run: |
          if git diff --quiet -- cards.json; then
            echo "No new cards"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cards.json
          git commit -m "Update card list"
          git push
